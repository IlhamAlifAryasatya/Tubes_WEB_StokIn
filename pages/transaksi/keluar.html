<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barang Keluar - StokIn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="navbar sticky-top bg-white border-bottom px-3">
    <h1 class="navbar-brand logo d-flex align-items-center gap-2 fw-bold mb-0">StokIn</h1>
    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </header>

  <div class="d-flex flex-grow-1">
    <nav class="sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1" aria-label="Navigasi utama">
      <div class="offcanvas-header border-bottom">
        <p class="offcanvas-title fw-bold mb-0">Menu</p>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Tutup menu"></button>
      </div>
      <div class="offcanvas-body p-3">
        <ul class="nav nav-pills flex-column w-100">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="../barang/katalog.html">Katalog</a></li>
          <li class="nav-item"><a class="nav-link" href="masuk.html">Barang Masuk</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="keluar.html">Barang Keluar</a></li>
          <li class="nav-item"><a class="nav-link" href="retur.html">Retur</a></li>
          <li class="nav-item mt-3">
            <span class="small text-uppercase fw-semibold text-body-secondary px-3">Akun</span>
            <ul class="nav nav-pills flex-column mt-1">
              <li class="nav-item"><a class="nav-link" href="../akun/login.html">Masuk</a></li>
              <li class="nav-item"><a class="nav-link" href="../akun/register.html">Daftar</a></li>
              <li class="nav-item"><a class="nav-link" href="../akun/logout.html">Keluar</a></li>
              <li class="nav-item"><a class="nav-link" href="../akun/profil.html">Profil Toko</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <div class="konten flex-grow-1 d-flex flex-column">
      <main class="container-fluid flex-grow-1 p-3 p-lg-4">
        <article>
          <h2 class="fs-3 fw-bold mb-4">Barang Keluar</h2>

          <div class="row g-3">
            <div class="col-lg-4 order-lg-2">
              <div class="card card-body">
                <div id="pesan" class="alert small py-2 tersembunyi" role="alert"></div>
                <form id="form-transaksi" data-jenis="keluar" action="#" method="post" novalidate>
                  <div class="mb-3">
                    <label for="tanggal" class="form-label">Tanggal</label>
                    <input type="date" id="tanggal" name="tanggal" value="2026-09-27" class="form-control" required>
                  </div>
                  <div class="mb-3">
                    <label for="barang" class="form-label">Nama Barang</label>
                    <select id="barang" name="barang" class="form-select" required>
                      <option value="">Pilih barang</option>
                    </select>
                    <div id="info-stok" class="form-text tersembunyi"></div>
                  </div>
                  <div class="mb-3">
                    <label for="jumlah" class="form-label">Jumlah</label>
                    <input type="number" id="jumlah" name="jumlah" min="1" value="1" class="form-control" required>
                  </div>
                  <div class="mb-3">
                    <label for="alasan" class="form-label">Alasan</label>
                    <select id="alasan" name="alasan" class="form-select" required>
                      <option value="">Pilih alasan</option>
                      <option value="terjual">Terjual</option>
                      <option value="rusak">Rusak</option>
                      <option value="kadaluarsa">Kadaluarsa</option>
                      <option value="dipakai">Dipakai sendiri</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="penerima" class="form-label">Penerima</label>
                    <input type="text" id="penerima" name="penerima" class="form-control">
                  </div>
                  <div class="mb-3">
                    <label for="keterangan" class="form-label">Keterangan</label>
                    <textarea id="keterangan" name="keterangan" rows="3" class="form-control"></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary rounded-pill px-4">Simpan</button>
                  <a href="../../index.html" class="btn btn-light rounded-pill px-4">Batal</a>
                </form>
              </div>
            </div>

            <div class="col-lg-8 order-lg-1">
              <div class="card card-body">
                <div class="table-responsive">
                  <table id="tabel-riwayat" class="table caption-top align-middle mb-0">
                    <caption>Riwayat barang keluar</caption>
                    <thead class="table-light">
                      <tr>
                        <th scope="col">Tanggal</th>
                        <th scope="col">Nama Barang</th>
                        <th scope="col">Jumlah</th>
                        <th scope="col">Alasan</th>
                        <th scope="col" class="d-none d-md-table-cell">Penerima</th>
                      </tr>
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </article>
      </main>

      <footer class="text-center small text-body-secondary py-3">
        <p class="mb-0">&copy; 2026 StokIn. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../../assets/js/script.js"></script>
</body>
</html>
