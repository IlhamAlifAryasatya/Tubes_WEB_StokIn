<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Barang - StokIn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="navbar sticky-top bg-white border-bottom px-3">
    <h1 class="navbar-brand logo d-flex align-items-center gap-2 fw-bold mb-0">StokIn</h1>
    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </header>

  <div class="d-flex flex-grow-1">
    <nav class="sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1" aria-label="Navigasi utama">
      <div class="offcanvas-header border-bottom">
        <p class="offcanvas-title fw-bold mb-0">Menu</p>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Tutup menu"></button>
      </div>
      <div class="offcanvas-body p-3">
        <ul class="nav nav-pills flex-column w-100">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="katalog.html">Katalog</a></li>
          <li class="nav-item"><a class="nav-link" href="../transaksi/masuk.html">Barang Masuk</a></li>
          <li class="nav-item"><a class="nav-link" href="../transaksi/keluar.html">Barang Keluar</a></li>
          <li class="nav-item"><a class="nav-link" href="../transaksi/retur.html">Retur</a></li>
          <li class="nav-item mt-3">
            <span class="small text-uppercase fw-semibold text-body-secondary px-3">Akun</span>
            <ul class="nav nav-pills flex-column mt-1">
              <li class="nav-item"><a class="nav-link" href="../akun/login.html">Masuk</a></li>
              <li class="nav-item"><a class="nav-link" href="../akun/register.html">Daftar</a></li>
              <li class="nav-item"><a class="nav-link" href="../akun/logout.html">Keluar</a></li>
              <li class="nav-item"><a class="nav-link" href="../akun/profil.html">Profil Toko</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <div class="konten flex-grow-1 d-flex flex-column">
      <main class="container-fluid flex-grow-1 p-3 p-lg-4">
        <article>
          <h2 class="fs-3 fw-bold mb-4">Tambah Barang</h2>

          <div class="card card-body">
            <form action="#" method="post" class="row g-3">
              <div class="col-md-6">
                <label for="kode" class="form-label">Kode Barang</label>
                <input type="text" id="kode" name="kode" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="nama" class="form-label">Nama Barang</label>
                <input type="text" id="nama" name="nama" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="kategori" class="form-label">Kategori</label>
                <select id="kategori" name="kategori" class="form-select" required>
                  <option value="">Pilih kategori</option>
                  <option value="sembako">Sembako</option>
                  <option value="minuman">Minuman</option>
                  <option value="perawatan">Perawatan</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="satuan" class="form-label">Satuan</label>
                <select id="satuan" name="satuan" class="form-select" required>
                  <option value="">Pilih satuan</option>
                  <option value="karung">Karung</option>
                  <option value="botol">Botol</option>
                  <option value="sak">Sak</option>
                  <option value="rak">Rak</option>
                  <option value="sachet">Sachet</option>
                  <option value="batang">Batang</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="stok" class="form-label">Stok</label>
                <input type="number" id="stok" name="stok" min="0" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="harga" class="form-label">Harga</label>
                <input type="number" id="harga" name="harga" min="0" class="form-control" required>
              </div>
              <div class="col-12">
                <label for="catatan" class="form-label">Catatan</label>
                <textarea id="catatan" name="catatan" rows="3" class="form-control"></textarea>
              </div>
              <div class="col-12">
                <label for="foto" class="form-label">Foto Barang</label>
                <input type="file" id="foto" name="foto" accept="image/*" class="form-control">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary rounded-pill px-4">Simpan</button>
                <a href="katalog.html" class="btn btn-light rounded-pill px-4">Batal</a>
              </div>
            </form>
          </div>
        </article>
      </main>

      <footer class="text-center small text-body-secondary py-3">
        <p class="mb-0">&copy; 2026 StokIn. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
