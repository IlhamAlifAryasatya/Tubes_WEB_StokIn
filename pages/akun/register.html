<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - StokIn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="navbar sticky-top bg-white border-bottom px-3">
    <h1 class="navbar-brand logo d-flex align-items-center gap-2 fw-bold mb-0">StokIn</h1>
    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </header>

  <div class="d-flex flex-grow-1">
    <nav class="sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1" aria-label="Navigasi utama">
      <div class="offcanvas-header border-bottom">
        <p class="offcanvas-title fw-bold mb-0">Menu</p>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Tutup menu"></button>
      </div>
      <div class="offcanvas-body p-3">
        <ul class="nav nav-pills flex-column w-100">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="../barang/katalog.html">Katalog</a></li>
          <li class="nav-item"><a class="nav-link" href="../transaksi/masuk.html">Barang Masuk</a></li>
          <li class="nav-item"><a class="nav-link" href="../transaksi/keluar.html">Barang Keluar</a></li>
          <li class="nav-item"><a class="nav-link" href="../transaksi/retur.html">Retur</a></li>
          <li class="nav-item mt-3">
            <span class="small text-uppercase fw-semibold text-body-secondary px-3">Akun</span>
            <ul class="nav nav-pills flex-column mt-1">
              <li class="nav-item"><a class="nav-link" href="login.html">Masuk</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="register.html">Daftar</a></li>
              <li class="nav-item"><a class="nav-link" href="logout.html">Keluar</a></li>
              <li class="nav-item"><a class="nav-link" href="profil.html">Profil Toko</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <div class="konten flex-grow-1 d-flex flex-column">
      <main class="container-fluid flex-grow-1 p-3 p-lg-4">
        <article class="row justify-content-center">
          <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="card card-body p-4 my-lg-4">
              <h2 class="fs-3 fw-bold text-center mb-4">Daftar Akun</h2>
              <div id="pesan" class="alert small py-2 tersembunyi" role="alert"></div>
              <form action="#" method="post" class="form-cek" data-berhasil="Akun berhasil dibuat. Silakan masuk." data-tujuan="login.html" novalidate>
                <div class="mb-3">
                  <label for="nama" class="form-label">Nama Lengkap</label>
                  <input type="text" id="nama" name="nama" autocomplete="name" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" id="email" name="email" autocomplete="username" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Kata Sandi</label>
                  <input type="password" id="password" name="password" autocomplete="new-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary rounded-pill w-100">Daftar</button>
              </form>

              <p class="text-center text-body-secondary mt-3 mb-0">Sudah punya akun? <a href="login.html">Masuk</a></p>
            </div>
          </div>
        </article>
      </main>

      <footer class="text-center small text-body-secondary py-3">
        <p class="mb-0">&copy; 2026 StokIn. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../../assets/js/script.js"></script>
</body>
</html>
