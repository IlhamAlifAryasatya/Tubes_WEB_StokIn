<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <header>
    <h1>StokIn</h1>
  </header>

  <nav aria-label="Navigasi utama">
    <ul>
      <li><a href="../../index.html">Dashboard</a></li>
      <li><a href="../barang/katalog.html">Katalog</a></li>
      <li><a href="../transaksi/masuk.html">Barang Masuk</a></li>

        </ul>
      </li>
    </ul>
  </nav>

  <main>
    <article class="form-akun">
      <h2>Daftar Akun</h2>

      <form action="#" method="post">
        <p>
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" autocomplete="name" required>
        </p>
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </p>
        <p>
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </p>
        <p>
          <button type="submit">Daftar</button>
        </p>
      </form>

      <p>Sudah punya akun? <a href="login.html">Masuk</a></p>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 StokIn. All rights reserved.</p>
  </footer>
</body>
