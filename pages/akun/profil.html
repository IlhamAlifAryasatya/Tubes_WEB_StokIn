        <ul class="nav nav-pills flex-column w-100">

    <div class="konten flex-grow-1 d-flex flex-column">
      <main class="container-fluid flex-grow-1 p-3 p-lg-4">
        <article>
          <h2 class="fs-3 fw-bold mb-4">Profil Toko</h2>

          <div class="card card-body">
            <form action="#" method="post" class="row g-3">
              <div class="col-md-6">
                <label for="nama_toko" class="form-label">Nama Toko</label>
                <input type="text" id="nama_toko" name="nama_toko" value="Toko Sembako Jaya" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="pemilik" class="form-label">Nama Pemilik</label>
                <input type="text" id="pemilik" name="pemilik" value="Ilham Alif Aryasatya" class="form-control" required>
              </div>
              <div class="col-12">
                <label for="alamat" class="form-label">Alamat</label>
                <textarea id="alamat" name="alamat" rows="3" class="form-control" required>Jl. Melati No. 12, Bandung</textarea>
              </div>
              <div class="col-md-6">
                <label for="telepon" class="form-label">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon" value="0812-3456-7890" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email Toko</label>
                <input type="email" id="email" name="email" value="tokosembakojaya@email.com" class="form-control" required>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary rounded-pill px-4">Simpan</button>
              </div>
            </form>
          </div>
        </article>
