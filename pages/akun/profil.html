  <main>
    <article>
      <h2>Profil Toko</h2>

      <form action="#" method="post">
        <p>
          <label for="nama_toko">Nama Toko</label>
          <input type="text" id="nama_toko" name="nama_toko" value="Toko Sembako Jaya" required>
        </p>
        <p>
          <label for="pemilik">Nama Pemilik</label>
          <input type="text" id="pemilik" name="pemilik" value="Ilham Alif Aryasatya" required>
        </p>
        <p>
          <label for="alamat">Alamat</label>
          <textarea id="alamat" name="alamat" rows="3" required>Jl. Melati No. 12, Bandung</textarea>
        </p>
        <p>
          <label for="telepon">Nomor Telepon</label>
          <input type="tel" id="telepon" name="telepon" value="0812-3456-7890" required>
        </p>
        <p>
          <label for="email">Email Toko</label>
          <input type="email" id="email" name="email" value="tokosembakojaya@email.com" required>
        </p>
        <p>
          <button type="submit">Simpan</button>
        </p>
      </form>
    </article>
